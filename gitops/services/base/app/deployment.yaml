apiVersion: apps/v1
kind: Deployment
metadata:
  name: creative-anchor
  labels:
    app: creative-anchor
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: creative-anchor
  template:
    metadata:
      labels:
        app: creative-anchor
    spec:
      containers:
        - name: creative-anchor
          image: creativeanchor/creative-anchor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: supabase-url
            - name: SUPABASE_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: supabase-key
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: gemini-api-key
            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: app-secret-key
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
