<!-- src/register.html -->
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor - Create Workspace</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; margin: 0; background-color: #1A1917;">
    <div id="registerError" class="error-message" style="display: none;"></div>
    <div class="login-page">
        <div class="login-container">
            <div class="brand-section" style="margin-bottom: 25px; display: flex; justify-content: center;">
                <h1 class="brand-title" style="font-size: 32px; font-weight: 700;">
                    <span class="brand-dot" style="width: 12px; height: 12px;"></span>
                    Anchor
                </h1>
            </div>

            <h2 class="brand-serif" style="font-size: 18px; font-weight: 600; margin-bottom: 25px; color: #EAE6DF; text-align: center; text-transform: uppercase; letter-spacing: 0.5px;">Register Workspace</h2>
            
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="username" class="config-label">Email</label>
                    <input type="text" id="username" class="config-input" placeholder="e.g. CreativeArtist@gmail.com" required>
                </div>
                <div class="form-group" style="margin-bottom: 25px;">
                    <label for="password" class="config-label">Password</label>
                    <input type="password" id="password" class="config-input" placeholder="••••••••" required>
                </div>
                <div class="form-group" style="margin-bottom: 25px;">
                    <label for="confirmPassword" class="config-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="config-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="block-btn" style="width: 100%; padding: 14px;">
                    Create Workspace
                </button>
            </form>
            <p class="login-note" style="margin-top: 25px; font-size: 13px; text-align: center; color: #A59E92;">
                Already have a workspace? <a href="login.html" style="color: #FF6200; text-decoration: none; font-weight: 700;">Login here</a>
            </p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
