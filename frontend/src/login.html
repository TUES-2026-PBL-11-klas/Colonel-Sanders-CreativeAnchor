<!-- src/login.html -->
<html>

<head>
    <meta charset="UTF-8">
    <!-- Fix #4: Content Security Policy — restricts which resources the page can load
         and contact, reducing the blast radius of any injected content. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data:;
                   connect-src 'self' http: https:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor - Artist Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body style="display: flex; flex-direction: column; min-height: 100vh; margin: 0; background-color: #1A1917;">
    <div class="window-titlebar">
        <span class="window-title">Creative Anchor</span>
        <div class="window-controls">
            <button onclick="minimizeWindow()" class="window-control-btn minimize" title="Minimize">
                <svg width="10" height="10" viewBox="0 0 10 10">
                    <path d="M0 5H10V6H0Z" fill="currentColor"></path>
                </svg>
            </button>
            <button onclick="maximizeWindow()" class="window-control-btn maximize" title="Maximize">
                <svg class="icon-max" width="10" height="10" viewBox="0 0 10 10">
                    <rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1">
                    </rect>
                </svg>
                <svg class="icon-restore" width="10" height="10" viewBox="0 0 10 10">
                    <rect x="1.5" y="3.5" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1">
                    </rect>
                    <path d="M3.5 3.5V1.5H8.5V6.5H6.5" fill="none" stroke="currentColor" stroke-width="1"></path>
                </svg>
            </button>
            <button onclick="closeWindow()" class="window-control-btn close" title="Close">
                <svg width="10" height="10" viewBox="0 0 10 10">
                    <path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1"></path>
                </svg>
            </button>
        </div>
    </div>

    <div class="login-page">
        <div class="login-container">
            <div class="brand-section" style="margin-bottom: 25px; display: flex; justify-content: center;">
                <h1 class="brand-title" style="font-size: 32px; font-weight: 700;">
                    <span class="brand-dot" style="width: 12px; height: 12px;"></span>
                    Creative Anchor
                </h1>
            </div>

            <h2 class="brand-serif"
                style="font-size: 18px; font-weight: 600; margin-bottom: 25px; color: #EAE6DF; text-align: center; text-transform: uppercase; letter-spacing: 0.5px;">
                Artist Login</h2>

            <div id="loginError" class="error-message"
                style="display: none; margin-bottom: 20px; padding: 12px; background-color: #3D1B1B; border: 2px solid #E81123; border-radius: 4px; color: #FFD1D1; font-size: 13px; font-weight: 600;">
            </div>

            <form id="loginForm">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="email" class="config-label">Email</label>
                    <input type="text" id="email" class="config-input" placeholder="e.g. CreativeArtist@gmail.com"
                        required>
                </div>
                <div class="form-group" style="margin-bottom: 25px;">
                    <label for="password" class="config-label">Password</label>
                    <input type="password" id="password" class="config-input" placeholder="••••••••" required>
                </div>
                <button type="submit" id="loginBtn" class="block-btn" style="width: 100%; padding: 14px;">
                    Access Workspace
                </button>
            </form>
            <!-- Fix #3: Use onclick with goToPage() so navigation goes through the
                 IPC navigate handler (and its auth guard) instead of bypassing it. -->
            <p class="login-note" style="margin-top: 25px; font-size: 13px; text-align: center; color: #A59E92;">
                Don't have a workspace? <span onclick="goToPage('register.html')"
                    style="color: #FF6200; text-decoration: none; font-weight: 700; cursor: pointer;">Register here</span>
            </p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
